name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build game distribution
        run: ./gradlew :game-server:shadowDistZip
      - name: Build Docker image
        run: docker build . --file Dockerfile --tag alter-server:${{ github.sha }}
