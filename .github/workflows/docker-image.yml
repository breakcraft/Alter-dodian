name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Prepare cache placeholders
      run: |
        mkdir -p data/cache
        touch data/cache/main_file_cache.dat2
        for idx in 0 1 2 3 4 5 7 8 9 10 11 12 13 14 15 17 18 19 20 255; do
          touch "data/cache/main_file_cache.idx${idx}"
        done
        touch data/xteas.json

    - name: Build distribution
      run: ./gradlew :game-server:shadowDistZip --no-daemon

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:${{ github.sha }}
